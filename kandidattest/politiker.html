<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kandidattest – Besvar udsagn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tailwind.css" />
  <style>
    .q-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
    .q-block:first-of-type { border-top: none; margin-top: 0; }
    .btn.ans.selected { background: var(--accent); border-color: rgba(0,0,0,.3); }
    .status { padding: 14px; border-radius: var(--radius); margin: 18px 0; }
    .status.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    textarea {
      width: 100%; padding: 10px 12px; border-radius: 14px;
      border: 1px solid var(--border); font-family: inherit;
      resize: vertical; min-height: 40px; background: #fff; color: var(--text);
    }
    textarea:focus { box-shadow: 0 0 0 3px rgba(242,210,0,.45); outline: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Kandidattest</h1>
      <p class="muted">Besvar udsagnene herunder. Dine svar bruges til at matche vælgere med kandidater.</p>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <div class="card"><p class="muted">Indlæser spørgsmål&hellip;</p></div>
  </main>

  <footer class="site-footer">
    <div class="wrap muted small">SAGA Kandidattest</div>
  </footer>

  <script src="/api/config.js"></script>
  <script src="politiker.js"></script>
</body>
</html>
