<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kandidattest – Besvar udsagn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body
    class="min-h-screen h-full grow overflow-y-auto flex flex-col justify-between relative"
  >
    <div class="absolute inset-0 overflow-hidden">
      <img
        src="assets/saga_yellow_logo.png"
        alt="SAGA"
        class="absolute -bottom-20 left-10 -rotate-40 scale-260"
      />
    </div>

    <header class="pt-12 pb-16 z-20">
      <div class="max-w-4xl mx-auto flex flex-row items-center px-12">
        <div class="flex flex-col">
          <h1 class="text-3xl leading-tight tracking-tight">Kandidattest</h1>
          <p class="max-w-prose text-lg text-muted">
            Besvar udsagnene herunder. Dine svar bruges til at matche vælgere
            med kandidater.
          </p>
        </div>
      </div>
    </header>

    <main
      id="app"
      class="max-w-4xl mx-auto w-full grow z-20 px-12"
      aria-live="polite"
    >
      <div
        class="bg-white border border-black/20 rounded shadow-lg px-8 py-12 flex flex-col"
      >
        <p class="text-muted">Indlæser spørgsmål&hellip;</p>
      </div>
    </main>

    <footer class="text-muted pb-12 pt-8 z-20">
      <div class="max-w-4xl mx-auto text-xs px-12">SAGA Kandidattest 2026</div>
    </footer>

    <script src="/api/config.js"></script>
    <script src="politiker.js"></script>
  </body>
</html>
